name: Promotion gate

# `rules/git-safety.md` § 1: `develop` integrates work and never originates it — it advances ONLY by
# promoting `workspace`, and nothing other than `workspace` may be merged into it. The purpose is
# that every change ORIGINATES on `workspace`, where the local hooks see it.
#
# That rule had one enforcement point and it was the wrong one. `hooks/validate-command.sh` refuses
# a local `git merge` into `develop` — and nobody merges into `develop` locally. Every promotion
# lands through `gh pr merge`, server-side, where no local hook runs.
#
# Measured in the sibling repository (usetheokit/theokit-sdk#496): forty-eight `main → develop` pull
# requests merged against a rule forbidding them, because the hook watched the path nobody uses.
# Here the count is one — this repository's back-merge automation was ported with the same defective
# leg and caught early — which is why this gate is cheap now and would not have been later.
#
# It does NOT replace the hook. The hook guards the local path, this guards the server path, and a
# repository with one of them is guarded on one side.
#
# REQUIRED, or it is decoration. An advisory check is a green tick nobody reads. But arming it
# BEFORE it has ever reported blocks every pull request on a status that never arrives, so it is
# armed after its first green run, never in the same change.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: promotion-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  head-must-be-workspace:
    name: promotion into develop comes from workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a head that is not workspace
        env:
          # Through the environment, never `${{ }}` inside `run:`. On a pull request from a fork the
          # head branch name is text the author chose, so interpolating it would put an attacker's
          # string where the shell parses commands.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "head: ${HEAD_REPO}:${HEAD_REF} -> base: ${BASE_REPO}:develop"

          # Checked BEFORE the branch name, and not redundant with it: a fork's `workspace` is a
          # different branch that no local hook ever saw, so matching on the name alone would admit
          # exactly the input this exists to refuse.
          if [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "::error::a pull request into develop must come from this repository's own workspace branch, not from ${HEAD_REPO}"
            exit 1
          fi

          if [ "${HEAD_REF}" != "workspace" ]; then
            echo "::error::develop only accepts the promotion from 'workspace' (rules/git-safety.md § 1); this pull request's head is '${HEAD_REF}'. Land the work on workspace first, then promote."
            exit 1
          fi

          echo "✓ head is workspace"
